<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#9aa7b5" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="480" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#223">后坐力模拟器概念图 v3.6（双侧齿条中置布局 · 原理示意）</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#777">①侧视=机构总览 ②B-B俯视+③A-A断面=双侧齿条与齿轮布局 · 具体驱动链按用户构思（减速比窗口 1~1.27）</text>

  <!-- ============ ① 侧视（机构总览，x-y） ============ -->
  <text x="80" y="84" font-size="14" font-weight="bold" fill="#333">① 侧视（机构总览）</text>

  <!-- 总长尺寸线 -->
  <line x1="80" y1="112" x2="545" y2="112" stroke="#888" stroke-width="1"/>
  <line x1="80" y1="104" x2="80" y2="120" stroke="#888"/>
  <line x1="545" y1="104" x2="545" y2="120" stroke="#888"/>
  <text x="312" y="105" text-anchor="middle" font-size="12" fill="#666">总长 ≈155 mm</text>

  <!-- 枪口 IMU -->
  <rect x="40" y="170" width="52" height="26" rx="4" fill="#16a085" stroke="#117a62"/>
  <text x="66" y="187" text-anchor="middle" font-size="10" fill="#fff">HI12S2</text>
  <line x1="66" y1="196" x2="66" y2="260" stroke="#16a085" stroke-dasharray="4,3"/>
  <text x="26" y="240" font-size="10" fill="#16a085">枪口IMU</text>

  <!-- 前墙(剖面) -->
  <rect x="80" y="260" width="30" height="237" fill="url(#hatch)" stroke="#5a6b7c"/>
  <text x="95" y="310" font-size="10" fill="#555" transform="rotate(-90 95 310)" text-anchor="middle">前墙10</text>

  <!-- 框架 -->
  <rect x="110" y="479" width="435" height="18" fill="#eef1f5" stroke="#5a6b7c"/>
  <rect x="110" y="260" width="201" height="12" fill="#eef1f5" stroke="#5a6b7c"/>
  <line x1="110" y1="260" x2="110" y2="497" stroke="#5a6b7c" stroke-width="3"/>
  <line x1="545" y1="260" x2="545" y2="497" stroke="#5a6b7c" stroke-width="3"/>
  <!-- 顶导向压板(横跨活塞区) -->
  <rect x="311" y="470" width="114" height="6" fill="#9aa7b5"/>
  <text x="368" y="492" text-anchor="middle" font-size="9" fill="#5a6b7c">顶导向压板(±y约束)</text>

  <!-- 模具弹簧 FL75 -->
  <polyline points="114,395 126,470 138,395 150,470 162,395 174,470 186,395 198,470 210,395 222,470 234,395 246,470 258,395 270,470 282,395 294,470 306,395" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="210" y="388" text-anchor="middle" font-size="10" fill="#4a90d9">模具弹簧 FL75 k=18.93（静置67·上簧28.35mm·537N）</text>
  <text x="210" y="220" font-size="10" fill="#5a6b7c">弹簧座（预压档位旋钮，唯一日常调节）</text>
  <line x1="140" y1="232" x2="150" y2="260" stroke="#5a6b7c" stroke-dasharray="3,3"/>

  <!-- 活块（无顶齿条！齿条在左右侧面） -->
  <rect x="311" y="380" width="114" height="90" fill="#ff9d3c" stroke="#d97b1f" stroke-width="2"/>
  <text x="368" y="400" text-anchor="middle" font-size="11" fill="#d97b1f">活块 全钢 48×31×38 ≈444g</text>
  <text x="368" y="415" text-anchor="middle" font-size="10" fill="#d97b1f">（顶面无齿条）</text>
  <text x="368" y="430" text-anchor="middle" font-size="10" fill="#d97b1f">齿条×2 在左右侧面中部</text>
  <text x="368" y="443" text-anchor="middle" font-size="10" fill="#d97b1f">节线与弹簧轴线共面</text>
  <text x="368" y="456" text-anchor="middle" font-size="10" fill="#d97b1f">→ 力矩项抵消（见②③）</text>
  <!-- 行程标注 -->
  <line x1="311" y1="346" x2="250" y2="346" stroke="#d97b1f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="339" text-anchor="middle" font-size="10" fill="#d97b1f">行程≈20.4mm</text>

  <!-- 缓冲：碟簧组+阻尼面层，预载螺母一次设定 -->
  <rect x="425" y="380" width="9" height="90" fill="#7d3c98"/>
  <rect x="434" y="380" width="81" height="90" fill="#e8d5f5" stroke="#7d3c98"/>
  <line x1="443" y1="380" x2="443" y2="470" stroke="#7d3c98" stroke-width="3"/>
  <line x1="458" y1="380" x2="458" y2="470" stroke="#7d3c98" stroke-width="3"/>
  <line x1="473" y1="380" x2="473" y2="470" stroke="#7d3c98" stroke-width="3"/>
  <line x1="488" y1="380" x2="488" y2="470" stroke="#7d3c98" stroke-width="3"/>
  <line x1="503" y1="380" x2="503" y2="470" stroke="#7d3c98" stroke-width="3"/>
  <text x="474" y="372" text-anchor="middle" font-size="9" fill="#7d3c98">碟簧组+阻尼面层</text>
  <text x="474" y="250" font-size="10" fill="#7d3c98">缓冲预载螺母：装配时一次设定151N，日常不动</text>
  <line x1="490" y1="262" x2="480" y2="380" stroke="#7d3c98" stroke-dasharray="3,3"/>

  <!-- 后盖+法兰 -->
  <rect x="515" y="260" width="30" height="237" fill="url(#hatch)" stroke="#5a6b7c"/>
  <rect x="545" y="330" width="36" height="100" fill="#8d99ae" stroke="#5a6b7c" stroke-width="2"/>
  <text x="563" y="322" text-anchor="middle" font-size="9" fill="#5a6b7c">法兰</text>
  <text x="563" y="452" text-anchor="middle" font-size="9" fill="#5a6b7c">→末端云台</text>

  <!-- 驱动（DM 卧顶，链按用户构思） -->
  <rect x="135" y="280" width="233" height="78" rx="8" fill="#27ae60" stroke="#1e8449"/>
  <text x="251" y="316" text-anchor="middle" font-size="11" fill="#fff">达妙DM-2325（沿长度卧顶）</text>
  <text x="251" y="332" text-anchor="middle" font-size="9" fill="#fff">24V·CAN·内置1:25·172g</text>
  <circle cx="368" cy="319" r="12" fill="none" stroke="#1e8449" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="380" y1="319" x2="480" y2="319" stroke="#1e8449" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="500" y="315" font-size="10" fill="#1e8449">驱动链（按你的构思）：</text>
  <text x="500" y="328" font-size="10" fill="#1e8449">伞齿转向→双侧竖直轴扇区齿轮</text>
  <text x="500" y="341" font-size="10" fill="#1e8449">减速比窗口 1~1.27（1.25 最优）</text>

  <!-- 高尺寸线 -->
  <line x1="610" y1="280" x2="610" y2="497" stroke="#888" stroke-width="1"/>
  <line x1="602" y1="280" x2="618" y2="280" stroke="#888"/>
  <line x1="602" y1="497" x2="618" y2="497" stroke="#888"/>
  <text x="616" y="394" font-size="11" fill="#666">高≈72</text>

  <!-- 后坐冲量 -->
  <line x1="330" y1="540" x2="470" y2="540" stroke="#e74c3c" stroke-width="4" marker-end="url(#arr)"/>
  <text x="400" y="533" text-anchor="middle" font-size="11" fill="#e74c3c">后坐冲量 2.5 N·s → 机架 → 机械臂</text>

  <!-- ============ ② B-B 俯视（x-z·齿条与齿轮布局） ============ -->
  <text x="620" y="84" font-size="14" font-weight="bold" fill="#333">② B-B 俯视（x-z：齿条-齿轮布局）</text>
  <!-- 弹簧轴线 -->
  <line x1="585" y1="240" x2="860" y2="240" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="862" y="236" font-size="9" fill="#4a90d9">弹簧轴线/齿条节线共面(虚线)</text>
  <!-- 活块俯视：38长×48宽 -->
  <rect x="660" y="168" width="120" height="144" fill="#ff9d3c" stroke="#d97b1f" stroke-width="2"/>
  <text x="720" y="235" text-anchor="middle" font-size="10" fill="#d97b1f">活块(俯视)</text>
  <!-- 左右侧齿条（牙朝向±z） -->
  <rect x="652" y="180" width="8" height="120" fill="#5a6b7c"/>
  <rect x="660" y="184" width="8" height="4" fill="#5a6b7c"/><rect x="660" y="196" width="8" height="4" fill="#5a6b7c"/><rect x="660" y="208" width="8" height="4" fill="#5a6b7c"/><rect x="660" y="220" width="8" height="4" fill="#5a6b7c"/><rect x="660" y="232" width="8" height="4" fill="#5a6b7c"/><rect x="660" y="244" width="8" height="4" fill="#5a6b7c"/>
  <rect x="780" y="180" width="8" height="120" fill="#5a6b7c"/>
  <rect x="772" y="184" width="8" height="4" fill="#5a6b7c"/><rect x="772" y="196" width="8" height="4" fill="#5a6b7c"/><rect x="772" y="208" width="8" height="4" fill="#5a6b7c"/><rect x="772" y="220" width="8" height="4" fill="#5a6b7c"/><rect x="772" y="232" width="8" height="4" fill="#5a6b7c"/><rect x="772" y="244" width="8" height="4" fill="#5a6b7c"/>
  <!-- 双侧扇区齿轮（竖直轴，俯视=圆） -->
  <circle cx="630" cy="240" r="22" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <circle cx="630" cy="240" r="4" fill="#5a6b7c"/>
  <circle cx="810" cy="240" r="22" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <circle cx="810" cy="240" r="4" fill="#5a6b7c"/>
  <text x="630" y="210" text-anchor="middle" font-size="9" fill="#b7950b">扇区齿轮L</text>
  <text x="810" y="210" text-anchor="middle" font-size="9" fill="#b7950b">扇区齿轮R</text>
  <!-- 径向力互消标注 -->
  <line x1="630" y1="240" x2="660" y2="240" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="810" y1="240" x2="780" y2="240" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="720" y="150" text-anchor="middle" font-size="9" fill="#e74c3c">两侧径向力互消 → ±z 自动对中</text>
  <text x="720" y="163" text-anchor="middle" font-size="9" fill="#5a6b7c">齿条相位 ±0.05mm（一次装夹加工/微调）</text>
  <!-- 宽度影响标注 -->
  <line x1="895" y1="150" x2="895" y2="330" stroke="#888" stroke-width="1"/>
  <line x1="887" y1="150" x2="903" y2="150" stroke="#888"/>
  <line x1="887" y1="330" x2="903" y2="330" stroke="#888"/>
  <text x="905" y="245" font-size="10" fill="#666">宽≈95~100</text>
  <text x="905" y="258" font-size="9" fill="#666">（缩活块到36宽</text>
  <text x="905" y="270" font-size="9" fill="#666">可回 ~66）</text>

  <!-- ============ ③ A-A 断面（y-z，从枪口看） ============ -->
  <text x="200" y="580" font-size="14" font-weight="bold" fill="#333">③ A-A 断面（y-z：齿轮-齿条啮合与导向）</text>
  <!-- 外壳 -->
  <rect x="60" y="600" width="204" height="150" fill="#f2f4f7" stroke="#5a6b7c" stroke-width="2"/>
  <!-- 顶底导向压板 -->
  <rect x="60" y="600" width="204" height="8" fill="#9aa7b5"/>
  <rect x="60" y="742" width="204" height="8" fill="#9aa7b5"/>
  <!-- 活块断面 48×31 -->
  <rect x="106" y="645" width="96" height="62" fill="#ff9d3c" stroke="#d97b1f" stroke-width="2"/>
  <!-- 两侧齿条（牙朝±z） -->
  <rect x="98" y="652" width="8" height="48" fill="#5a6b7c"/>
  <rect x="202" y="652" width="8" height="48" fill="#5a6b7c"/>
  <!-- 双侧齿轮（竖直轴，断面=圆） -->
  <circle cx="72" cy="676" r="18" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <circle cx="72" cy="676" r="3" fill="#5a6b7c"/>
  <circle cx="252" cy="676" r="18" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <circle cx="252" cy="676" r="3" fill="#5a6b7c"/>
  <!-- 侧壁开槽示意 -->
  <rect x="60" y="660" width="6" height="34" fill="#fff" stroke="#5a6b7c"/>
  <rect x="258" y="660" width="6" height="34" fill="#fff" stroke="#5a6b7c"/>
  <text x="270" y="620" font-size="9" fill="#5a6b7c">外壳宽≈96~100</text>
  <text x="270" y="633" font-size="9" fill="#5a6b7c">活块48</text>
  <text x="270" y="646" font-size="9" fill="#8a97a8">侧壁开槽供齿轮啮合</text>
  <text x="270" y="659" font-size="9" fill="#5a6b7c">顶底压板导向(±y)</text>
  <text x="270" y="672" font-size="9" fill="#d97b1f">齿条在活块±z面中部</text>

  <!-- ============ 决策与参数块 ============ -->
  <rect x="420" y="580" width="520" height="280" rx="8" fill="#f8fafc" stroke="#c9d2db"/>
  <text x="436" y="604" font-size="13" font-weight="bold" fill="#333">v3.6 关键决策与参数（待确认项加⚠️）</text>
  <text x="436" y="626" font-size="11" fill="#333">· 齿条×2 移至活块左右侧面中部，节线与弹簧轴线共面 → 力矩抵消</text>
  <text x="436" y="644" font-size="11" fill="#333">· ⚠️ 齿轮轴为竖直轴（齿条牙朝±z的必然），驱动链按你的构思（伞齿+双侧扇区齿轮）</text>
  <text x="436" y="662" font-size="11" fill="#333">· 双齿条相位 ±0.05mm：一次装夹加工或齿条微调结构；径向力互消自带±z对中</text>
  <text x="436" y="680" font-size="11" fill="#333">· ⚠️ 宽度 56→~95~100（齿轮+开槽壁厚）；缩活块宽到36可回~66——待你拍板</text>
  <text x="436" y="698" font-size="11" fill="#333">· 调校SOP：缓冲预载螺母装配时一次设定151N（日常不动）→ 主簧预压为档位旋钮 → 齿条微调吸收静止位漂移</text>
  <text x="436" y="716" font-size="11" fill="#333">· 减速比窗口 R∈[1,1.27] 无痛（R=1.25最优：DM 375rpm/扭矩77%）；1.3~1.87仅短爆；R&lt;1 超扭矩判毙</text>
  <text x="436" y="734" font-size="11" fill="#333">· 其余不变：FL75弹簧(k18.93)/2.5N·s/行程20.4mm/碟簧缓冲(7.6J)/长155/高72</text>
  <text x="436" y="752" font-size="11" fill="#333">· 导向改顶底压板（±y），侧面留给齿条；齿根疲劳/齿根圆角≥0.3~0.4m</text>
  <text x="436" y="774" font-size="11" fill="#888">注：本图为原理示意，双侧驱动链的精确几何（齿轮竖直轴高度/同步方式）以你的结构定稿为准，确定后我再补按比例的正式图。</text>
</svg>
