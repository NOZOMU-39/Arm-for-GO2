<path d="M 736.5 210.0 A 40 40 0 0 0 733.7 194.1" fill="none" stroke="#333" stroke-width="1.2"/>
<text x="748.9" y="202.6" font-size="14" fill="#333" text-anchor="start">α</text>
<line x1="860.3" y1="148.0" x2="558.4" y2="257.9" stroke="#d62728" stroke-width="4.5" opacity="0.55"/>
<text x="669.4" y="122.0" font-size="12.5" fill="#d62728">第 1 对齿：A→E</text>
<line x1="688.3" y1="210.6" x2="386.5" y2="320.5" stroke="#ff7f0e" stroke-width="4.5" opacity="0.55"/>
<text x="497.4" y="244.6" font-size="12.5" fill="#ff7f0e">第 2 对齿：A′→E′（相差一个基节 pb）</text>
<circle cx="688.3" cy="210.6" r="4" fill="#ff7f0e"/>
<circle cx="386.5" cy="320.5" r="4" fill="#ff7f0e"/>
<text x="670.3" y="204.6" font-size="13" fill="#ff7f0e" text-anchor="start">A′</text>
<text x="390.5" y="334.5" font-size="13" fill="#ff7f0e" text-anchor="start">E′</text>
<rect x="40" y="326" width="920" height="304" fill="#f8f8f8" stroke="#ddd"/>
<text x="56" y="350" font-size="13" fill="#111">推导要点（全部按 m=1、z=18、α=20° 真值代入）</text>
<text x="56" y="376" font-size="13" fill="#333">① 起点 A：齿条齿顶线 y=m 与啮合线相交 ⇒ g_a = m/sinα = 2.924 mm</text>
<text x="56" y="402" font-size="13" fill="#333">    （直角三角形 A-F-P：AF=m，∠APF=α ⇒ AP = m/sinα）</text>
<text x="56" y="428" font-size="13" fill="#333">② 终点 E：齿轮齿顶圆与啮合线相交 ⇒ g_r = √(r_a²−r_b²) − r·sinα = 2.258 mm</text>
<text x="56" y="454" font-size="13" fill="#333">③ 实际啮合线长 g = g_a + g_r = 5.182 mm</text>
<text x="56" y="480" font-size="13" fill="#333">④ 基节 p_b = π·m·cosα = 2.952 mm（相邻两对齿在啮合线上的间距）</text>
<text x="56" y="506" font-size="13" fill="#333">⑤ 重合度 εα = g/p_b = 1.755（同时参与啮合的齿对数）</text>
<text x="56" y="532" font-size="13" fill="#333">⑥ 接触点在啮合线上移动速度 = r_b·ω ⇒ 一对齿全程经历转角 g/r_b</text>
<text x="56" y="558" font-size="13" fill="#333">   换算到节圆弧长 = g/cosα = εα·π·m = 5.514 mm ⇐这就是"多出来的一截"</text>
<text x="56" y="584" font-size="13" fill="#333">⑦ 故不完全齿轮的实际啮合行程 L = n·π·m + εα·π·m = (n + εα)·π·m</text>
<text x="56" y="610" font-size="13" fill="#333">   图中红色段=第1对齿接触区间，橙色=第2对齿，两者重叠 0.76 个基节（=εα−1）</text>
</svg>