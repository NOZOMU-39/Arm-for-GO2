<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 CAN WiFi 助手</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #1a1a2e; color: #eee; padding: 16px; max-width: 720px; margin: auto;
}
h1 {
  text-align: center; color: #00d4ff; margin-bottom: 12px; font-size: 1.3em;
  display: flex; align-items: center; justify-content: center; gap: 12px;
}
h1 .gear { cursor: pointer; font-size: 0.8em; opacity: 0.6; transition: opacity 0.2s; }
h1 .gear:hover { opacity: 1; }
.card {
  background: #16213e; border-radius: 10px; padding: 14px; margin-bottom: 12px;
  border: 1px solid #0f3460;
}
.card-title {
  font-size: 0.95em; color: #00d4ff; margin-bottom: 8px; padding-bottom: 6px;
  border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center;
}
button {
  background: #0f3460; color: #00d4ff; border: 1px solid #00d4ff;
  padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85em; margin: 3px;
}
button:hover { background: #1a5276; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { background: #00d4ff; color: #1a1a2e; font-weight: bold; border: none; }
button.primary:hover { background: #33ddff; }
button.danger { background: #8b0000; color: #fcc; border-color: #f66; }
input, select, textarea {
  background: #0d1b36; color: #eee; border: 1px solid #0f3460;
  padding: 7px; border-radius: 4px; font-size: 0.85em; font-family: inherit;
}
input { width: 100%; margin: 3px 0; }
select { margin: 3px; }
textarea {
  width: 100%; height: 220px; resize: vertical; margin-top: 6px;
  font-family: "Consolas", "Courier New", monospace; font-size: 0.78em;
  white-space: pre-wrap; word-break: break-all; background: #0a1120;
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row label { white-space: nowrap; color: #aaa; font-size: 0.82em; min-width: 45px; }
.hint { color: #888; font-size: 0.75em; margin-top: 4px; }
.tag { display: inline-block; font-size: 0.72em; padding: 2px 7px; border-radius: 10px; margin-left: 3px; }
.tag.green { background: #1b5e20; color: #a5d6a7; }
.tag.yellow { background: #4a3f00; color: #ffd54f; }
.tag.red { background: #4a0000; color: #fcc; }
.tag.cyan { background: #004d40; color: #80deea; }
.fps { font-family: "Consolas", monospace; color: #ffd54f; font-size: 0.85em; }
#statusBar { font-size: 0.82em; line-height: 1.6; }
#settingsPanel { display: none; }
</style>
</head>
<body>

<h1>
  ESP32 WiFi CAN
  <span class="gear" onclick="toggleSettings()" title="设置">&#9881;</span>
</h1>

<!-- WiFi 连接 (独立版需要，固件内嵌版不需要) -->
<div class="card" id="connectCard">
  <div class="card-title">📡 连接 ESP32</div>
  <div class="row">
    <label>地址:</label>
    <input type="text" id="hostInput" value="192.168.4.1" size="18" style="width:180px;flex:none">
    <button id="btnConnect" class="primary" onclick="connect()">🔗 连接</button>
    <button id="btnDisconnect" class="danger" onclick="disconnect()" disabled>断开</button>
    <span id="statusBadge" class="tag red">未连接</span>
  </div>
</div>

<!-- 通道状态 -->
<div class="card" id="statusCard" style="display:none">
  <div class="card-title">通道状态</div>
  <div id="statusBar" class="hint">加载中...</div>
</div>

<!-- 设置面板 (默认隐藏) -->
<div class="card" id="settingsPanel">
  <div class="card-title">设置</div>
  <div class="hint" style="margin-bottom:8px">主力通道：笔记本热点名，配一次永不变。留空=不启用STA</div>
  <div class="row"><label>STA热点:</label><input type="text" id="sta_ssid" placeholder="MyHotspot" style="flex:1"></div>
  <div class="row" style="margin-top:4px"><label>STA密码:</label><input type="text" id="sta_psk" placeholder="热点密码" style="flex:1"></div>
  <div style="margin-top:8px;padding-top:8px;border-top:1px solid #0f3460">
    <div class="hint" style="margin-bottom:4px">备用通道：AP始终在线</div>
    <div class="row"><label>AP名称:</label><input type="text" id="ap_ssid" value="ESP32-WiFi-CAN" style="flex:1"></div>
    <div class="row" style="margin-top:4px"><label>AP密码:</label><input type="text" id="ap_psk" value="12345678" style="flex:1"></div>
  </div>
  <div style="margin-top:8px;padding-top:8px;border-top:1px solid #0f3460">
    <div class="row"><label>CAN速率:</label>
      <select id="can_rate" style="width:130px">
        <option value="25">25 kbps</option><option value="50">50 kbps</option>
        <option value="100">100 kbps</option><option value="125">125 kbps</option>
        <option value="250">250 kbps</option><option value="500">500 kbps</option>
        <option value="800">800 kbps</option><option value="1000" selected>1 Mbps</option>
      </select>
    </div>
  </div>
  <button class="primary" onclick="saveSettings()" style="width:100%;margin-top:8px">💾 保存到 ESP32</button>
  <div id="saveResult" class="hint" style="margin-top:6px"></div>
</div>

<!-- 发送 CAN -->
<div class="card" id="sendCard" style="display:none">
  <div class="card-title">📤 发送 CAN <span class="fps" id="txFps">TX: 0 fps</span></div>
  <div class="row">
    <label>ID: 0x</label>
    <input type="text" id="canId" value="0000007B" maxlength="8" style="width:110px;flex:none"
           oninput="this.value=this.value.replace(/[^0-9a-fA-F]/g,'')">
    <select id="canExtd" style="width:100px">
      <option value="0">标准帧</option><option value="1">扩展帧</option>
    </select>
  </div>
  <div class="row" style="margin-top:6px">
    <label>数据:</label>
    <input type="text" id="canData" value="11 22 33 44 55 66 77 88" placeholder="hex空格分隔 1-8字节" style="flex:1">
    <button class="primary" onclick="sendCAN()">🚀 发送</button>
  </div>
</div>

<!-- 接收 CAN -->
<div class="card" id="rxCard" style="display:none">
  <div class="card-title">📥 接收 CAN <span class="fps" id="rxFps">RX: 0 fps</span></div>
  <textarea id="rxArea" readonly placeholder="等待接收..."></textarea>
  <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
    <button onclick="document.getElementById('rxArea').value=''">🗑️ 清空</button>
    <label style="color:#aaa;font-size:0.82em;cursor:pointer">
      <input type="checkbox" id="autoScroll" checked> 自动滚动
    </label>
  </div>
</div>

<script>
// ====== 全局状态 ======
let baseUrl = '';
let connected = false;
let pollTimer = null;
let statusTimer = null;
let txCount = 0, txLast = Date.now(), txRate = 0;
let rxCount = 0, rxLast = Date.now(), rxRate = 0;
let esp32RxRate = 0;

// ====== 工具函数 ======
function el(id) { return document.getElementById(id); }
function ts() {
  const d = new Date();
  return d.toLocaleTimeString('zh-CN', {hour12: false}) + '.' +
         String(d.getMilliseconds()).padStart(3, '0');
}

// ====== 连接管理 ======
function updateUI(conn) {
  connected = conn;
  el('btnConnect').disabled = conn;
  el('btnDisconnect').disabled = !conn;
  if (conn) {
    el('statusBadge').textContent = '已连接';
    el('statusBadge').className = 'tag green';
    el('statusCard').style.display = '';
    el('sendCard').style.display = '';
    el('rxCard').style.display = '';
  } else {
    el('statusBadge').textContent = '未连接';
    el('statusBadge').className = 'tag red';
    el('statusCard').style.display = 'none';
    el('sendCard').style.display = 'none';
    el('rxCard').style.display = 'none';
  }
}

function connect() {
  const host = el('hostInput').value.trim();
  if (!host) { alert('请输入 ESP32 地址'); return; }
  baseUrl = 'http://' + host;

  fetch(baseUrl + '/getStatus', { signal: AbortSignal.timeout(5000) })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(j => {
      updateUI(true);
      // 同步设置面板
      el('sta_ssid').value = j.sta_ssid || '';
      el('ap_ssid').value = j.ap_ssid;
      el('can_rate').value = j.can_rate;
      // 开始轮询
      if (pollTimer) clearInterval(pollTimer);
      if (statusTimer) clearInterval(statusTimer);
      statusTimer = setInterval(updateStatus, 3000);
      pollTimer = setInterval(pollCAN, 100);
      updateStatus();
    })
    .catch(e => {
      updateUI(false);
      alert('连接失败: ' + e.message);
    });
}

function disconnect() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
  updateUI(false);
  txCount = rxCount = 0;
  txRate = rxRate = 0;
}

// ====== 设置面板 ======
function toggleSettings() {
  const p = el('settingsPanel');
  p.style.display = (p.style.display === 'none' || p.style.display === '') ? 'block' : 'none';
}

// ====== 状态刷新 ======
function updateStatus() {
  if (!connected) return;
  fetch(baseUrl + '/getStatus')
    .then(r => r.json())
    .then(j => {
      let html = '';
      if (j.sta_connected) {
        html += 'STA <span class="tag green">已连接</span> ' + j.sta_ip + ' (可上网+控制)';
      } else if (j.sta_ssid) {
        html += 'STA <span class="tag yellow">连接中 ' + j.sta_ssid + '</span>';
      } else {
        html += 'STA <span class="tag red">未配置</span> (进设置配热点)';
      }
      html += '<br>AP <span class="tag cyan">在线</span> ' + j.ap_ssid + ' @ 192.168.4.1';
      html += '<br>CAN ' + j.can_rate + 'kbps | RX ' + (j.can_rx_rate||0).toFixed(1) +
              'fps TX ' + (j.can_tx_rate||0).toFixed(1) + 'fps | ' + j.firmware;
      el('statusBar').innerHTML = html;
      esp32RxRate = j.can_rx_rate || 0;
    });
}

// ====== CAN 接收轮询 ======
function pollCAN() {
  if (!connected) return;
  fetch(baseUrl + '/getCANData')
    .then(r => r.json())
    .then(arr => {
      if (!arr || arr.length === 0 || arr[0] === '') return;
      const now = Date.now();
      const auto = el('autoScroll').checked;
      // 批量构建字符串，一次赋值避免多次 DOM 重排
      let chunk = '';
      for (let i = 0; i < arr.length; i++) {
        rxCount++;
        chunk += '[' + ts() + '] ' + arr[i] + '\n';
      }
      const ta = el('rxArea');
      ta.value += chunk;
      // 超过 2000 行裁剪
      const lines = ta.value.split('\n');
      if (lines.length > 2000) ta.value = lines.slice(-1500).join('\n');
      if (now - rxLast >= 1000) {
        rxRate = (rxCount / ((now - rxLast) / 1000)).toFixed(1);
        rxCount = 0; rxLast = now;
      }
      // 本地渲染速率 / ESP32 真实速率
      el('rxFps').textContent = 'RX: ' + rxRate + ' / ' + esp32RxRate.toFixed(0) + ' fps';
      if (auto) ta.scrollTop = ta.scrollHeight;
    });
}

// ====== 发送 CAN ======
function sendCAN() {
  if (!connected) { alert('未连接'); return; }
  const id = parseInt(el('canId').value.padStart(8, '0'), 16);
  const extd = parseInt(el('canExtd').value);
  const dataStr = el('canData').value.trim();

  fetch(baseUrl + '/CANSend', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: id, extd: extd, data: dataStr })
  })
    .then(r => r.text())
    .then(() => {
      txCount++;
      const now = Date.now();
      if (now - txLast >= 1000) {
        txRate = (txCount / ((now - txLast) / 1000)).toFixed(1);
        txCount = 0; txLast = now;
      }
      el('txFps').textContent = 'TX: ' + txRate + ' fps';
    });
}

// ====== 保存设置 ======
function saveSettings() {
  if (!connected) { alert('未连接'); return; }
  const fd = new FormData();
  fd.append('sta_ssid', el('sta_ssid').value);
  fd.append('sta_psk', el('sta_psk').value);
  fd.append('ap_ssid', el('ap_ssid').value);
  fd.append('ap_psk', el('ap_psk').value);
  fd.append('can_rate', el('can_rate').value);

  fetch(baseUrl + '/SaveSettings', { method: 'POST', body: fd })
    .then(r => r.text())
    .then(() => {
      el('saveResult').innerHTML = '<span style="color:#a5d6a7">✅ 已保存! 新设置立即生效</span>';
      setTimeout(() => { el('saveResult').innerHTML = ''; }, 3000);
    });
}

// 页面加载：若从 ESP32 直开则自动连接
window.addEventListener('load', function () {
  const hn = window.location.hostname;
  if (hn && hn !== 'localhost' && hn !== '127.0.0.1' && hn !== '') {
    el('hostInput').value = hn;
    connect();
  }
});
</script>

</body>
</html>
