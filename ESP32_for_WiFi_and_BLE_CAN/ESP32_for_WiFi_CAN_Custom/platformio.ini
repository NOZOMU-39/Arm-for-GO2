; 适用于 微雪 ESP32-S3-RS485-CAN 开发板
; 资料: https://www.waveshare.net/wiki/ESP32-S3-RS485-CAN
;
;   引脚定义:
;     CAN:   GPIO15(TXD2), GPIO16(RXD2)  via TWAI
;     RS485: GPIO17(TXD1), GPIO18(RXD1), GPIO21(TXD1EN)
;     I2C:   GPIO38(SCL), GPIO39(SDA), GPIO40(INT)
;     RTC:   PCF85063
;     GPIO:  CH1=GPIO47
;
;   Flash: 16MB, PSRAM: 8MB (OPI)
;   烧录用 USB 口（原生 USB CDC，非 USB 转 UART）

[env:esp32-s3-rs485-can]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ---- 硬件配置 ----
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; ---- 烧录 & 串口监视 ----
upload_speed = 921600
monitor_speed = 115200

; ---- USB CDC (原生USB串口输出) ----
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; ---- 库依赖 ----
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.0
